name: ci

on:
  push:
    branches: [main]
    tags: ['suite-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core-matrix:
    name: core py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tests/test_core_contracts.py
      - run: python tests/test_core_canonical_paths.py
      - run: python tests/test_monorepo_layout.py
      - run: python tools/check.py

  full:
    name: full suite + release gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # 全 31 个测试文件由 tools/test_all.py 动态发现，杜绝新增测试漏接。
      - name: All tests (dynamic discovery)
        run: python tools/test_all.py

      - name: Monorepo manifest gate
        run: python tools/check.py
      - name: Build check (read-only)
        run: python tools/build.py --check
      - name: Release train check (read-only)
        run: python tools/release.py --check
      - name: Manifest verification
        run: python tools/verify_manifests.py
      - name: 2.x release manifest drift
        run: python tools/gen_release_manifest.py --check
      - name: Hermes stdio smoke
        env:
          STALKER_MCP_PLUGIN_ROOT: ${{ github.workspace }}/products/mcp_hermes
        run: python tests/mcp_hermes_smoke.py

  independent-audit:
    name: independent static/security audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r audit-requirements.txt ruff bandit pip-audit
      - name: ruff (undefined names)
        run: ruff check --select F821 core plugins/ai_translate products skills/stalker-translate tools
      - name: ruff (swallowed exceptions / late binding, informational)
        continue-on-error: true
        run: ruff check --select S110,B023 core plugins/ai_translate products skills/stalker-translate tools
      - name: bandit (high severity only)
        run: bandit -q -ll -r core plugins/ai_translate products skills/stalker-translate
      - name: dependency vulnerability audit
        run: pip-audit -r audit-requirements.txt
